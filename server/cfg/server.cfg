// Rendered by scripts/deploy.sh. Edit this template, not the copy on the server.
hostname "@SERVER_NAME@"
rcon_password "@RCON_PASSWORD@"
sv_password "@SV_PASSWORD@"
sv_location "@SV_LOCATION@"
sv_region @SV_REGION@
sv_lan 0

// Surf movement (CS:S-style)
sv_airaccelerate 150
sv_accelerate 5
sv_friction 4
sv_stopspeed 75
sv_gravity 800
sv_sticktoground 0
sv_timeout 60

// Network rates for 100 tick
sv_minrate 30000
sv_maxrate 0
sv_minupdaterate 66
sv_maxupdaterate 100
sv_mincmdrate 66
sv_maxcmdrate 100

// No sandbox stuff
sbox_noclip 0
sbox_godmode 1
sv_allowupload 0
sv_allowdownload 1
sv_alltalk 1
mp_falldamage 0

// Bans persist
exec banned_user.cfg
exec banned_ip.cfg
writeid
writeip
